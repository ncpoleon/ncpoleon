name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main"
  pull_request: # required to have reports on PRs
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are worth cancelling -- they burn `codspeed-macro` time
  # measuring a commit nobody will look at. Runs on main are not: CodSpeed uses
  # them as the baseline every later comparison is drawn against, so cancelling
  # one because a second merge landed behind it loses a data point permanently.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  approve-benchmarks:
    environment:
      name: Run walltime benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Approve walltime benchmarks
        run: echo Only run walltime benchmarks if required.

  benchmarks:
    name: Run benchmarks
    runs-on: codspeed-macro
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: pyproject.toml
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      # Built here rather than inside the CodSpeed action's `run:` so that cargo
      # and rustc are not executed under the measurement harness.
      - name: Build the extension module
        run: uv sync --all-extras --dev --config-setting 'build-args=--profile=release'
      # No benchmark in this selection calls `solve`, so MOSEK is not needed here.
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@f99becdce5e5d51fd556489ebef684f4ecfd6286
        with:
          mode: simulation
          run: uv run --no-sync pytest -x --codspeed --splits 5 --group ${{ matrix.shard }} -m "not walltime" -v --durations=0

  benchmarks-walltime:
    name: Run benchmarks with walltime
    runs-on: codspeed-macro
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5]
    needs: [approve-benchmarks]
    timeout-minutes: 90  # The Codspeed runner macro hard stops after one hour anyway
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: pyproject.toml
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Build the extension module
        run: uv sync --all-extras --dev --config-setting 'build-args=--profile=release'
      # A pull request from a fork gets no secrets, so `MSK_LICENSE` is empty
      # there. That is not a failure, and the job must not treat it as one:
      # only the `mosek-*` parametrisations skip themselves via
      # `is_mosek_available()`. The max-cut relaxation benchmark and every
      # `picos-cvxopt` solve still run, so a regression in relaxation
      # construction or in the solve plumbing is still caught before it lands
      # on `buffer`.
      #
      # Only MOSEK-specific timings wait for the `buffer` -> `main` pull
      # request, which is same-repo and does get the license.
      #
      # An unusable license that was actually *provided* stays a hard error:
      # silently benchmarking a fraction of the suite on main would be worse
      # than a red check.
      - name: Check out the MOSEK license
        env:
          MSK_LICENSE: ${{ secrets.MSK_LICENSE }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "$MSK_LICENSE" ]; then
            if [ "$IS_FORK_PR" != "true" ]; then
              echo "::error::MSK_LICENSE is required for non-fork benchmark runs"
              exit 1
            fi
            echo "No MOSEK license available (fork pull request): the MOSEK-backed benchmarks will skip themselves. The picos/cvxopt solves and the relaxation benchmark still run." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$MSK_LICENSE" > "$HOME/mosek.lic"
          echo "MOSEKLM_LICENSE_FILE=$HOME/mosek.lic" >> "$GITHUB_ENV"
          MOSEKLM_LICENSE_FILE="$HOME/mosek.lic" uv run --no-sync python -c \
            "from ncpoleon.utils import is_mosek_available; assert is_mosek_available(), 'MOSEK license checkout failed'"
      - name: Run the walltime benchmarks
        uses: CodSpeedHQ/action@f99becdce5e5d51fd556489ebef684f4ecfd6286
        with:
          mode: walltime
          run: uv run --no-sync pytest -x --codspeed --splits 5 --group ${{ matrix.shard }} -m walltime -v --durations=0
